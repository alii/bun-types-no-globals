name: Update Bun Types

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-types:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest

      - run: bun install

      - name: Publish new versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          for VERSION in $(bun run generator/missing-versions.ts "$(jq -r .version package.json)"); do
            case "$VERSION" in
              *-*) NPM_TAG=canary; RELEASE_FLAG=--prerelease ;;
              *)   NPM_TAG=latest; RELEASE_FLAG=--latest ;;
            esac

            bun run generator/index.ts "$VERSION"
            npm publish --tag "$NPM_TAG" --access public --provenance

            git add lib package.json
            git commit -m "update bun types to v$VERSION [automated]"
            git tag "v$VERSION" -m "Release v$VERSION"
            git push origin main "v$VERSION"

            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes "Automated release of bun-types-no-globals v$VERSION" \
              "$RELEASE_FLAG"
          done
